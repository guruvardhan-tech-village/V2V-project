name: CodeQL analysis
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * 0'

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: python, java, cpp

      - name: Make Arduino (.ino) files visible as C++ (.cpp)
        run: |
          set -e
          for f in $(git ls-files '*.ino' || true); do
            dst="${f%.*}.cpp"
            echo "copying $f -> $dst"
            mkdir -p "$(dirname "$dst")"
            cp "$f" "$dst"
          done

      - name: Set up Python (optional)
        run: |
          python -m pip install --upgrade pip
          # pip install -r requirements.txt  # Uncomment if you need dependencies

      - name: Build Kotlin/Java (Gradle) if present
        run: |
          if [ -f build.gradle ] || [ -f settings.gradle ] || [ -f gradlew ]; then
            chmod +x ./gradlew || true
            ./gradlew assemble --no-daemon || true
          else
            echo "No Gradle build files found, skipping Gradle build"
          fi

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v2
